,"劈"],["C","砍"],["D","撩"]],"a":"ABCD","t":"多选","s":["短兵"],"src":"cgtk.org","qid":2369,"i":2369},{"q":"关于2026版规则新增内容，正确的有","o":[["A","小腿纳入得分部位"],["B","同一种技术动作连续两次以上击中同一得分部位被禁用"],["C","电子计分系统操作员岗位"],["D","仲裁摄像人员岗位"]],"a":"ABCD","t":"多选","s":["短兵"],"src":"cgtk.org","qid":2370,"i":2370},{"q":"短兵的得分部位包括","o":[["A","头部"],["B","躯干"],["C","大腿"],["D","小腿"]],"a":"ABCD","t":"多选","s":["短兵"],"src":"cgtk.org","qid":2371,"i":2371},{"q":"一局比赛中，有 _____ 名边裁判员显示双方运动员得分相差达 _____ 分时，判得分多者为该场胜方。","o":[],"a":"4","t":"填空","s":["短兵"],"src":"cgtk.org","qid":2372,"i":2372},{"q":"2026版规则规定短兵的可用方法为刺、劈、砍、斩、_____。","o":[],"a":"撩","t":"填空","s":["短兵"],"src":"cgtk.org","qid":2373,"i":2373},{"q":"一局比赛中，受重击被强制读秒 _____ 次，对方为该局胜方；一场比赛中被重击强制读秒达 _____ 次，判对方为该场胜方。","o":[],"a":"2","t":"填空","s":["短兵"],"src":"cgtk.org","qid":2374,"i":2374},{"q":"平局判定顺序为：受警告少者为胜方、受劝告少者为胜方、_____者为胜方。","o":[],"a":"体重轻","t":"填空","s":["短兵"],"src":"cgtk.org","qid":2375,"i":2375},{"q":"简述短兵比赛的裁判人员构成。","o":[],"a":"裁判人员由裁判人员和辅助裁判人员两部分构成。（一）裁判人员：1. 总裁判长1人，副总裁判长1-2人；2. 临场裁判组（根据比赛规模可设1-2组）：裁判长1人，副裁判长1-2人，场上裁判员（须设）2-4人，记录员、计时员各1人，边裁判员5人（须设2-3组）；3. 编排记录长1人；4. 检录长1人。（二）辅助裁判人员：1. 编排记录员4人；2. 检录员4-6人；3. 医务监督1-2人，医务人员2-5人；4. 宣告人员1-2人；5. 电子计分系统操作员2-4人；6. 仲裁摄像人员2-4人。2026版规则新增了电子计分系统操作员和仲裁摄像人员两个岗位，同时取消主裁判手持短兵尺，改为徒手手势执裁，对手势标准化提出了更高要求。","t":"问答","s":["短兵"],"src":"cgtk.org","qid":2376,"i":2376},{"q":"简述场地和器材的有关规定。","o":[],"a":"（一）场地：比赛场地为中国武术协会认定的11m×11m 垫子或地毯，中间边长为9m 的正方形场地为运动员比赛场地，场地四周预留1m宽的安全缓冲区；采用赛台时，周边铺设2m 宽的保护垫；比赛场地安全区域外围1m 内不得有广告招牌、广告墙及广告柱等。（二）器材：1. 运动员必须使用中国武术协会认定的短兵进行比赛，重量根据男女不同年龄、组别区分对待，误差值为正负10g。表一规定：儿童男子/女子30kg以下为65cm、200g；少年男子/女子为75cm、300g；青年女子65kg以下为100cm、450g；青年女子70kg以上为105cm、500g；青年男子70kg以下为105cm、500g；青年男子75kg以上为110cm、550g；成年女子56kg以下为100cm、450g；成年女子60kg以上为105cm、500g；成年男子60kg以下为105cm、500g；成年男子65kg以上为110cm、550g。2. 裁判器材包括：电子计分系统1-2套；色别牌（圆牌直径20厘米，共18块，红、蓝各6块）；劝告牌（黄色12块）；警告牌（红色6块）；强制读秒牌（蓝色6块）；放牌架（长60厘米、高10厘米，红蓝各1个）；弃权牌（圆牌直径30厘米，黄色2个）；申请复议牌（圆牌直径30厘米，橙色2个）；短兵架（架高130厘米）；秒表2块；哨子2个；扩音喇叭3个；铜锣、锣锤、锣架各1副；计数器15-20块；摄像机2台；公制计量器2台；无线麦克风4套。","t":"问答","s":["短兵"],"src":"cgtk.org","qid":2377,"i":2377},{"q":"简述2026版规则相对旧版的主要变化及其影响。","o":[],"a":"2026版规则的主要变化包括：（1）得分逻辑由按部位定分值转为按技术难度定分值，普通击中统一1分，只有转身击头或躯干得2分，导向从打哪里变为怎么打；（2）新增小腿为得分部位，低段攻击有了战术价值；（3）明确有效击打区域为短兵前段（约前1/3），中后段击打不得分，对距离感和控制力提出更高要求；（4）新增禁用条款：同一种技术动作连续两次以上击中对方同一得分部位禁止（儿童和少年禁止连续敲击头部），禁止刷分，要求技术多样化；（5）主裁判取消短兵尺，改为徒手手势执裁，判罚指示全部改为手势，对手势标准化要求更高；（6）新增电子计分系统操作员和仲裁摄像人员岗位，电子计分纳入规则框架；（7）明确申请复议程序，参赛队有两次机会，必须现场10秒内提出，败诉须交1000元复议费；（8）参赛单位开放，俱乐部、武馆选手可参赛；（9）体重级别统一为8级；（10）明确写入反兴奋剂要求。整体影响：运动员需掌握多种技术、重视距离控制；教练员需重新设计战术体系、纳入转身与低段攻击训练；裁判员观察精度要求提高，角色从判定者向监督者转变；赛事组织者面临参赛人数增加、编排复杂度上升、安全与保险压力增大等挑战。","t":"问答","s":["短兵"],"src":"cgtk.org","qid":2378,"i":2378},{"q":"比赛期间运动员无故弃权，只取消该场成绩。","o":[],"a":"错误","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2379,"i":2379},{"q":"比赛进行时，教练员可举弃权牌表示弃权，运动员也可举手要求弃权。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2380,"i":2380},{"q":"电子计分系统故障可以作为暂停比赛的条件之一。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2381,"i":2381},{"q":"被指定进攻的一方5 秒钟内仍不进攻，对方得1分。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2382,"i":2382},{"q":"运动员举手要求暂停时，应暂停比赛。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2383,"i":2383},{"q":"上场有意松脱护具属于技术犯规。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2384,"i":2384},{"q":"抓握己方兵身或使用短兵贴身防守属于技术犯规。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2385,"i":2385},{"q":"儿童和少年禁止连续敲击对方头部。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2386,"i":2386},{"q":"故意冲撞、推人等阻挡对方进攻的行为属于禁用方法。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2387,"i":2387},{"q":"使用短兵柄部击打对方属于禁用方法。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2388,"i":2388},{"q":"短兵可用方法来源于武术刀、剑等短兵器的技术方法。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2389,"i":2389},{"q":"竞赛纠纷解决委员会成员不参加与本人所在单位有牵连问题的讨论和表决。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2390,"i":2390},{"q":"一局比赛中受重击被强制读秒几次，对方为该局胜方","o":[["A","1次"],["B","2次"],["C","3次"],["D","4次"]],"a":"B","t":"单选","s":["短兵"], "C","最小级别开始"],["D","任意级别开始"]],"a":"C","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2431,"i":2431},{"q":"儿童男子/女子30kg以下组短兵的尺寸是","o":[["A","75cm"],["B","65cm"],["C","100cm"],["D","110cm"]],"a":"B","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2432,"i":2432},{"q":"警告牌的颜色是","o":[["A","红色"],["B","蓝色"],["C","黄色"],["D","橙色"]],"a":"A","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2433,"i":2433},{"q":"辅助裁判人员中编排记录员的人数为","o":[["A","2人"],["B","4人"],["C","6人"],["D","8人"]],"a":"B","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2434,"i":2434},{"q":"关于禁用方法，下列说法正确的是：","o":[["A","攻击短兵脱手的一方属于禁用方法"],["B","攻击短兵脱手的一方是允许的"],["C","只有击倒对方后才可攻击其脱手兵器"],["D","攻击脱手方需经场上裁判员同意"]],"a":"A","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2435,"i":2435},{"q":"下列属于技术犯规的有","o":[["A","消极逃跑或主动出界"],["B","抓握己方兵身或使用短兵贴身防守"],["C","非持械手臂有意格挡对方短兵"],["D","击中对方禁击部位"]],"a":"ABC","t":"多选","s":["短兵"],"src":"cgtk.org","qid":2436,"i":2436},{"q":"辅助裁判人员包括","o":[["A","编排记录员"],["B","检录员"],["C","医务监督"],["D","电子计分系统操作员"]],"a":"ABCD","t":"多选","s":["短兵"],"src":"cgtk.org","qid":2437,"i":2437},{"q":"关于短兵前段有效的规定，正确的有","o":[["A","只有短兵前段（约前1/3）击中才有效"],["B","中段击打不得分"],["C","后段击打不得分"],["D","兵柄部位击打有效"]],"a":"ABC","t":"多选","s":["短兵"],"src":"cgtk.org","qid":2438,"i":2438},{"q":"短兵个人赛采用三局两胜制，每局比赛时间 _____ 分钟，局间休息 _____ 分钟。","o":[],"a":"2","t":"填空","s":["短兵"],"src":"cgtk.org","qid":2439,"i":2439},{"q":"申请复议败诉还须交付 _____ 元复议费。","o":[],"a":"1000","t":"填空","s":["短兵"],"src":"cgtk.org","qid":2440,"i":2440},{"q":"简述短兵比赛的犯规分类与罚则。","o":[],"a":"犯规分两级：（一）技术犯规，共9条，包括消极逃跑或主动出界、处于不利状况时举手要求暂停、抓握己方兵身或使用短兵贴身防守、非持械手臂有意格挡对方短兵、有意拖延比赛时间、上场有意松脱护具、不听从场上裁判员指挥或不服从裁判判决或不遵守规定的礼节、侮辱性语言吐唾沫摔护头摔扔短兵等不文明行为、场上教练员谩骂吵闹及愤懑离开赛场等不文明行为。处罚：每出现一次技术犯规，劝告一次，对方得1分。（二）侵人犯规，共3条，包括在口令开始前或喊停后进攻对方、击中对方禁击部位、使用禁用方法击中对方。处罚：每出现一次侵人犯规，警告一次，对方得2分。升级处罚：侵人犯规达3次，取消该场比赛资格；故意伤人，取消全部比赛资格，所有成绩无效；使用违禁药物或局间休息时吸氧，取消比赛资格，所有成绩无效。记忆口诀：劝告等于技术犯规等于对方得1分；警告等于侵人犯规等于对方得2分。","t":"问答","s":["短兵"],"src":"cgtk.org","qid":2441,"i":2441},{"q":"简述短兵比赛的申请复议程序。","o":[],"a":"（1）参赛队在整个比赛过程中有两次申请复议场上裁判员判罚的机会，若复议结果不正确，则相应减少一次申请复议的机会。（2）参赛队如果对场上裁判员的临场判罚有异议，必须在现场立即申请复议（10秒内），竞赛纠纷解决委员会立刻复议并作出仲裁结论，如申请复议正确，改变裁判结果；如申请复议不正确，则维持原判。（3）作出仲裁结论后，申请复议方应履行完成书面申请复议程序，如败诉还须交付1000元复议费。（4）各队必须服从竞赛纠纷解决委员会的最终裁决，如果因不服裁决而无理纠缠、不履行申请复议程序、拒缴复议费等，将视情节轻重按照竞赛中的有关规定进行严肃处理。该机制类似网球中的鹰眼挑战，但由人工看录像判定，目的是减少误判、增加公平性。","t":"问答","s":["短兵"],"src":"cgtk.org","qid":2442,"i":2442},{"q":"简述短兵比赛中的消极比赛处理办法。","o":[],"a":"为防止磨洋工，2026版规则规定了消极比赛的处理办法：（1）主裁判发现消极比赛时，应指定一方进攻；（2）被指定的一方在被指定进攻后5 秒钟内仍不进攻时，对方得1分；（3）同时暂停比赛，重新开始。规则还规定，消极逃跑或主动出界属于技术犯规，处罚为劝告一次，对方得1分。这一机制的立法意图是让不想打的运动员在经济上和规则上都不划算，从而保证比赛的对抗性和观赏性。","t":"问答","s":["短兵"],"src":"cgtk.org","qid":2443,"i":2443},{"q":"短兵的可用方法中包含点。","o":[],"a":"错误","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2444,"i":2444},{"q":"在规定的称量时间内体重不符合报名级别时，仍可参加后面所有场次的比赛。","o":[],"a":"错误","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2445,"i":2445},{"q":"某级别参赛人数仅有1人时，仍可正常参加该级别比赛。","o":[],"a":"错误","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2446,"i":2446},{"q":"变动级别的运动员不能定为种子选手。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2447,"i":2447},{"q":"使用同一种技术动作连续两次以上击中对方同一得分部位是允许的。","o":[],"a":"错误","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2448,"i":2448},{"q":"双方同时或相继出界、倒地，不得分。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2449,"i":2449},{"q":"少年（儿童）组短兵的重心零点在护手盘距离兵身8-10cm 处。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2450,"i":2450},{"q":"双方短兵同时或相继脱手落地，不得分。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2451,"i":2451},{"q":"2026版规则新纳入的得分部位是","o":[["A","手臂"],["B","小腿"],["C","后脑"],["D","咽喉"]],"a":"B","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2452,"i":2452},{"q":"短兵的禁击部位是","o":[["A","头部、躯干、大腿"],["B","后脑、咽喉、裆部"],["C","小腿、脚踝、脚背"],["D","腰部、背部、臀部"]],"a":"B","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2453,"i":2453},{"q":"使用转身动作击中对方的头部、躯干，得","o":[["A","1分"],["B","2分"],["C","3分"],["D","不计分"]],"a":"B","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2454,"i":2454},{"q":"青年运动员的参赛年龄是","o":[["A","15-17岁"],["B","16-18岁"],["C","14-17岁"],["D","17-20岁"]],"a":"A","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2455 :2520},{"q":"2026版规则中得2分的情况包括","o":[["A","使用转身动作击中对方的头部、躯干"],["B","被强制读秒一次"],["C","受警告1次"],["D","受劝告一次"]],"a":"ABC","t":"多选","s":["短兵"],"src":"cgtk.org","qid":2521,"i":2521},{"q":"场上裁判员判罚后，被判罚的运动员向场上裁判员行抱兵礼。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2522,"i":2522},{"q":"宣布比赛结果前，运动员需取下护头。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2523,"i":2523},{"q":"短兵兵尖为多少厘米的缓冲软垫","o":[["A","2cm"],["B","3cm"],["C","4cm"],["D","5cm"]],"a":"B","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2524,"i":2524},{"q":"申请复议牌的颜色是","o":[["A","红色"],["B","蓝色"],["C","黄色"],["D","橙色"]],"a":"D","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2525,"i":2525},{"q":"临场裁判组中记录员、计时员各为","o":[["A","各1人"],["B","各2人"],["C","记录员1人、计时员2人"],["D","各3人"]],"a":"A","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2526,"i":2526},{"q":"关于竞赛监督委员会，下列说法正确的是：","o":[["A","竞赛监督委员会不直接参与纠纷解决委员会职责范围内的工作"],["B","竞赛监督委员会直接参与纠纷解决委员会工作"],["C","两个委员会职责完全相同"],["D","两个委员会由同一批人员组成"]],"a":"A","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2527,"i":2527},{"q":"简述2026版短兵规则的得分标准（分值体系）。","o":[],"a":"2026版规则得分标准分三部分：（一）得2分：1. 使用转身动作击中对方的头部、躯干，得2分；2. 被强制读秒一次，对方得2分；3. 受警告1次，对方得2分。（二）得1分：1. 使用短兵技法击中对方的得分部位，得1分；2. 倒地，站立者得1分；3. 短兵掉地，对方得1分；4. 出界，对方得1分；5. 被指定进攻后5秒钟内仍不进攻时，对方得1分；6. 受劝告一次，对方得1分。（三）不得分（7条）：1. 技法不清楚，击中效果不明显；2. 击中对方非得分部位；3. 用短兵中后段兵身任何部位击打对方；4. 双方短兵同时或相继脱手落地；5. 双方同时或相继出界、倒地；6. 击中同时双方运动员有身体接触；7. 使用转身动作击中对方的大腿、小腿。核心逻辑：由旧版按部位定分值转为按技术难度定分值，普通击中统一1分，只有转身击头或躯干才值2分。","t":"问答","s":["短兵"],"src":"cgtk.org","qid":2528,"i":2528},{"q":"关于侵人犯规，下列说法正确的是：","o":[["A","在口令开始前或喊停后进攻对方属于侵人犯规"],["B","在口令开始前进攻属于技术犯规"],["C","喊停后进攻属于技术犯规"],["D","只要接触对方就属侵人犯规"]],"a":"A","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2529,"i":2529},{"q":"短兵团体赛采用三场两胜制，每队由几名运动员组成","o":[["A","2名"],["B","3名"],["C","4名"],["D","5名"]],"a":"B","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2530,"i":2530},{"q":"短兵的得分部位包括头部、躯干、大腿和 _____。","o":[],"a":"小腿","t":"填空","s":["短兵"],"src":"cgtk.org","qid":2531,"i":2531},{"q":"短兵比赛中，运动员被重击倒地不起达 _____ 秒（侵人犯规除外），判对方为该场胜方。","o":[],"a":"10","t":"填空","s":["短兵"],"src":"cgtk.org","qid":2532,"i":2532},{"q":"简述短兵比赛的比赛礼节要求。","o":[],"a":"（1）每场比赛开始前介绍运动员时，运动员向观众行抱兵礼。（2）每局比赛开始前，运动员上场后先向本方教练员行抱兵礼，教练员还抱拳礼；运动员之间再相互行抱兵礼。（3）宣布比赛结果前，运动员需取下护头。宣布结果后，运动员相互行抱兵礼；再向场上裁判员行抱兵礼，场上裁判员还礼；然后左侧跨步，向对方教练员行抱兵礼，教练员还抱拳礼。（4）边裁判员换人时，互相行抱拳礼。（5）场上裁判员判罚后，被判罚的运动员向场上裁判员行抱兵礼。抱拳礼的动作规范：双脚立正站立，左掌右拳环抱于胸前，高与胸齐，手与胸之间距离为20-30厘米。","t":"问答","s":["短兵"],"src":"cgtk.org","qid":2533,"i":2533},{"q":"对方短兵掉地时，对方得","o":[["A","1分"],["B","2分"],["C","3分"],["D","不计分"]],"a":"A","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2534,"i":2534},{"q":"称量体重由检录长负责，谁配合完成","o":[["A","编排记录长"],["B","编排记录员"],["C","宣告员"],["D","边裁判员"]],"a":"B","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2535,"i":2535},{"q":"下列属于不得分情形的有","o":[["A","用短兵中后段兵身任何部位击打对方"],["B","击中同时双方运动员有身体接触"],["C","双方短兵同时或相继脱手落地"],["D","使用短兵技法击中对方得分部位"]],"a":"ABC","t":"多选","s":["短兵"],"src":"cgtk.org","qid":2536,"i":2536},{"q":"技术犯规的处罚是 _____，对方得 _____ 分；侵人犯规的处罚是 _____，对方得 _____ 分。","o":[],"a":"劝告","t":"填空","s":["短兵"],"src":"cgtk.org","qid":2537,"i":2537},{"q":"使用违禁药物或局间休息时吸氧，取消比赛资格，所有成绩无效。","o":[],"a":"正确","t":"判断","s":["短兵"],"src":"cgtk.org","qid":2538,"i":2538},{"q":"一局比赛双方出现平局时，最后顺位的判定标准是","o":[["A","受警告少者为胜方"],["B","受劝告少者为胜方"],["C","体重轻者为胜方"],["D","体重重者为胜方"]],"a":"C","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2539,"i":2539},{"q":"《武术短兵竞赛规则与裁判法（2026试行）》规定，短兵竞赛的竞赛种类包括","o":[["A","团体比赛、个人比赛"],["B","只有个人比赛"],["C","只有团体比赛"],["D","团体比赛、个人比赛、表演比赛"]],"a":"A","t":"单选","s":["短兵"],"src":"cgtk.org","qid":2540,"i":2540},{"q":"简述短兵比赛的胜负评定办法。","o":[],"a":"胜负评定分三个层次：（一）优势胜利评定：1. 一局比赛中，有4名边裁判员显示双方运动员得分相差达14分时，判得分多者为该场胜方；2. 比赛中，被重击倒地不起达10秒（侵人犯规除外），或虽能站立但知觉失常，判对方为该场胜方；3. 一场比赛中，被重击强制读秒达3次（侵人犯规除外），判对方为该场胜方。（二）每局胜负评定：每局结束时依据记录员记录和边裁判员评判结果判定；一局中受重击被强制读秒2次（侵人犯规除外），对方为该局胜方；一局平局时按受警告少者、受劝告少者、体重轻者的顺序判定，三者仍相同则为平局。（三）每场胜负评定：先胜两局者为该场胜方；运动员经医务监督诊断不能继续比赛者判对方胜；经医务监督确诊为诈伤者判对方胜；因对方犯规而受伤经确认不能继续比赛者为该场胜方，但不得参加后面所有场次比赛；循环赛获胜局数相同为平局；淘汰赛获胜局数相同按受警告少、受劝告少顺序判定，仍相同则加赛一局，依次类推。","t":"问答","s":["短兵"],"src":"cgtk.org","qid":2541,"i":2541},{"q":"技法不清楚、击中效果不明显的，不得分。","o":[] ],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":4980,"i":4977},{"q":"健康是人生之本，损伤、灾难、疾病、事故，意味着是对人类生存、康乐、幸福、美好生活的毁灭。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":4981,"i":4978},{"q":"谈恋爱分手后对方再次约见你，应该去把话说清楚。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":4982,"i":4979},{"q":"防范在先是防身自卫的第一步，也是最有效的战略。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":4983,"i":4980},{"q":"避开歹徒作案的最佳时机会大大减少受害的可能性。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":4984,"i":4981},{"q":"安全的生活方式对防范暴力犯罪至关重要。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":4985,"i":4982},{"q":"发达国家法律比较健全，一般不会发生暴力犯罪。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":4986,"i":4983},{"q":"在无法避免的搏斗情况下应该击打对方：","o":[["A","腿部。"],["B","要害。"],["C","头部。"]],"a":"B","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":4987,"i":4984},{"q":"和男朋友分手后他说心情非常不好，要约我去湖边谈一谈：","o":[["A","应该去。"],["B","不去。"],["C","带着其它朋友和我一起去。"]],"a":"B","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":4988,"i":4985},{"q":"从安全角度考虑有人敲门时你应该做到：","o":[["A","请对方进门谈。"],["B","不要随意开门。"],["C","可以开门，但不邀对方进来。"]],"a":"B","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":4989,"i":4986},{"q":"防身自卫存在以下哪种性质：","o":[["A","不可预知性。"],["B","主动性。"],["C","随机性。"]],"a":"A","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":4990,"i":4987},{"q":"在遇到暴力犯罪时，为了自保你应该采取哪种武力方式保护自己：","o":[["A","标准的搏击技巧。"],["B","利用肢体技术。"],["C","拿起身边一切可以做为武器的东西。"]],"a":"C","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":4991,"i":4988},{"q":"当面对暴力犯罪，必须出手的情况下，过程中对方已经没有能力反抗时，你应该首先选择的是：","o":[["A","弄死对方才能绝对安全。"],["B","不弄死对方也得弄残废。"],["C","制服对方即可。"]],"a":"C","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":4992,"i":4989},{"q":"当与人发生矛盾的时候首先应该选择的是：","o":[["A","退让。"],["B","僵持。"],["C","武力制服对方。"]],"a":"A","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":4993,"i":4990},{"q":"在进行武力对抗时，首先应该保障的是：","o":[["A","自身安全。"],["B","财务安全。"],["C","犯罪分子的安全。"]],"a":"A","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":4994,"i":4991},{"q":"遇到暴力犯罪发生时，做为旁观者应该：","o":[["A","赶紧躲避，置之不理。"],["B","找到一个相对安全的环境，然后报警。"],["C","上前动手，帮助受害者。"]],"a":"B","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":4995,"i":4992},{"q":"你认为以下哪种情况最不容易诱发暴力犯罪：","o":[["A","穿着暴露。"],["B","与人为善。"],["C","习惯夜生活。"]],"a":"B","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":4996,"i":4993},{"q":"常见的攻击路线有哪些：","o":[["A","直线。"],["B","横线。"],["C","斜线。"],["D","弧线。"]],"a":"AB","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":4997,"i":4994},{"q":"常用的徒手搏击技术分类有哪些：","o":[["A","拳法。"],["B","腿法。"],["C","摔法。"],["D","擒拿法。"]],"a":"ABC","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":4998,"i":4995},{"q":"以下哪些是老师在课堂上讲过的防身自卫模式：","o":[["A","小鸡模式。"],["B","刺猬模式。"],["C","河狸模式。"],["D","小马模式。"]],"a":"ABC","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":4999,"i":4996},{"q":"武力防卫的基本原则有哪些：","o":[["A","技术应用没有限制。"],["B","先下手为强。"],["C","视情况而用。"],["D","速度优于力量。"]],"a":"ABCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5000,"i":4997},{"q":"应对抢劫时正确的做法：","o":[["A","马上交钱，决不为保钱财而冒险，尤其是在没有跑时。"],["B","扔了钱就跑，以免歹徒得了钱后继续施暴。"],["C","不要试图去记住歹徒什么样，以免招致杀身之祸。"],["D","如果歹徒得手后还想带走或伤害受害者，则受害者则应立即逃出或拼命格斗。"]],"a":"ABCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5001,"i":4998},{"q":"应对凶杀时正确的做法：","o":[["A","如果对方执意要杀害受害者，则受害者的选择就已经很少了。一条选择是逃命，什么都不要，只要逃走就是胜利。"],["B","当发现歹徒不会放过自己时，自卫者应抓住时机格斗反抗。尽管危险性比较大，但总比任人宰割强。"],["C","告诉他法律知识避免犯罪。"],["D","交出财务来换回生命。"]],"a":"AB","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5002,"i":4999},{"q":"应对挷架劫持时正确的做法：","o":[["A","如有生命危险，切不可妄动，应妥协服从并同时寻找机会。"],["B","留心环境，丢下点证物以利警察寻找。"],["C","不要把全部底细都透露给歹徒，因为歹徒会感到你无用了而起杀心。"],["D","若发现歹徒有松懈之机、或打算干掉受害者时，受害者应努力逃走或杀出血路。"]],"a":"ABCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5003,"i":5000},{"q":"对付熟人强暴时正确的做法：","o":[["A","态度坚决、冷酷无情、严辞拒绝。"],["B","警告对方法律责任。"],["C","给对方一个台阶下，不失面子地收场。"],["D","找个借口如例假期等等。"]],"a":"ABCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5004,"i":5001},{"q":"在遇到歹徒时哪些做法是行之有效的：","o":[["A","能谈则谈"],["B","引旁人注意以求帮助"],["C","尖声喊叫或逃走"],["D","不要反抗"]],"a":"ABC","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5005,"i":5002},{"q":"在出差旅游时应该做到：","o":[["A","尽量住酒店"],["B","不去危险的地方"],["C","不搭不安全的交通工具"],["D","要携带必要的防身武器"]],"a":"BCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5006,"i":5003},{"q":"在选乘公共交通工具时应该注意：","o":[["A","财不外漏"],["B","避免惹事"],["C","保持手机畅通"],["D","避免夜间出行"]],"a":"ABD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5007,"i":5004},{"q":"以下哪些属于暴力犯罪：","o":[["A","杀人"],["B","强暴"],["C","辱骂"],["D","抢劫"]],"a":"ABD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5008,"i":5005},{"q":"构建防身自卫科学体系需要在哪些方面努力：","o":[["A","政府"],["B","教育"],["C","社会"],["D","家庭"]],"a":"ABCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5009,"i":5006},{"q":"防身自卫科学的性质有哪些：","o":[["A","防御性与被动性"],["B","不可预知性"],["C","残酷性"],["D","复杂性"]],"a":"ABCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5010,"i":5007},{"q":"预防暴力犯罪的主要模式：","o":[["A","好人模式"],["B","运动模式"],["C","变色龙模式"],["D","逃脱模式"]],"a":"AC","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5011,"i":5008},{"q":"请选出有可能会发生暴力犯罪的场所：","o":[["A","家里"],["B","学校"],["C","酒吧"],["D","公交车"]],"a":"ABCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5012,"i":5009},{"q":"在人多的环境中，暴力犯罪发生的机率较小。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5013,"i":5010},{"q":"小明与小亮发生矛盾，小明先对小亮打了一拳，并无大碍的小亮拿起板凳猛砸小明，导致小明多处骨折。因为是对方先动手所以小亮的行为属于正当防卫。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5014,"i":5011},{"q":"在公交车行驶过程中乘客与司机发生口角，乘客情绪激动上前抢夺司机方向盘，旁边的乘客立即上前用武力制止了这一行为，在殴打过程中抢夺方向盘的乘客受轻伤，司机和其它乘客均不对此负法律责任。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5015,"i":5012},{"q":"摆拳是横线形进攻方法。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5016,"i":5013},{"q":"防身自卫战术的具体要求有保存体力、动作协调、反击有力、保持平衡、动作快速、把握时机、严谨快捷和掌握距离等。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5017,"i":5014},{"q":"防身自卫术的使用原则：临危不乱，头脑清醒、把握尺度，防卫恰当、审时度势，应对准确、有胆有识，机智应变。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5018,"i":5015},{"q":"利用歹徒近身，观察四周而出现的时机，果敢迅速地使用杀伤性攻击技术。一旦得手尽可能地进行二次攻击，加大杀伤效果。一旦逃脱控制，尽可能地迅速远离对方，并高声呼救。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5019,"i":5016},{"q":"当遇到暴力犯罪时应该首先出手制服对方。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5020,"i":5017},{"q":"喝酒与暴力犯罪没有任何关系。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5021,"i":5018},{"q":"受害者的软弱好欺是引发歹徒作案的主要因素之一。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5022,"i":5019},{"q":"遇到抢劫，首先应该把财务给他在寻找逃脱的机会。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5023,"i":5020},{"q":"谈恋爱是一个危险性极高的行为。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5024,"i":5021},{"q":"提高安全意识，进行安全防范和自我保护的教育，使人意识到在人的权利当中，“生活权”是第一位的。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5025,"i":5022},{"q":"一个身体强健、反应灵敏的人比一个体弱多病、行动笨拙的人在遇到危机时更有能力处理险情、防灾避难，也更有可能生存下来。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5026,"i":5023},{"q":"在和中距离和歹徒格斗时应该采用什么技术：","o":[["A","腿法。"],["B","拳法。"],["C","摔法。"]],"a":"B","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5027,"i":5024},{"q":"当陌生人和你搭讪时你应该做到：","o":[["A","礼貌回避。"],["B","畅所欲言。"],["C","赶走对方。"]],"a":"A","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5028,"i":5025},{"q":"从安全角度考虑找工作时哪点更重要：","o":[["A","薪水高低。"],["B","工作是不是轻松。"],["C","工作环境是否值得信任。"]],"a":"C","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5029,"i":5026},{"q":"你交朋友的态度应该是：","o":[["A","只关心对方有没有钱。"],["B","只关心和他相处是否快乐。"],["C","综合考虑对方行为习惯和性格。"]],"a":"C","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5030,"i":5027},{"q":"在面对暴力犯罪时你认为自己的什么是最重要的：","o":[["A","生命。"],["B","自尊。"],["C","财产。"]],"a":"A","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5031,"i":5028},{"q":"你对待邻居的态度应该是：","o":[["A","不熟悉。"],["B","讨厌。"],["C","尽量处好关系。"]],"a":"C","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5032,"i":5029},{"q":"从安全角度考虑住宅应该选择在：","o":[["A","房租便宜的地方。"],["B","繁华地带。"],["C","远离低收入区。"]],"a":"C","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5033,"i":5030},{"q":"要想远离暴力犯罪平时需要：","o":[["A","练好武功。"],["B","养成好的生活习惯。"],["C","学会能言善辩。"]],"a":"B","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5034,"i":5031},{"q":"如果面对歹徒你感觉到不管怎么做都会受到伤害时你应该：","o":[["A","顺从对方。"],["B","拼死反抗。"],["C","哭泣求饶。"]],"a":"B","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5035,"i":5032},{"q":"当意识到有安全威胁的情况首先应该选择的是：","o":[["A","回避。"],["B","挺身而出。"],["C","报警。"]],"a":"A","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5036,"i":5033},{"q":"好人模式指的含义是：","o":[["A","多做好人好事。"],["B","发生暴力犯罪时，尽量去帮助别人对抗暴行。"],["C","平时少树敌，避免与人产生仇恨。"]],"a":"C","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5037,"i":5034},{"q":"影响人类生命健康的主要三大因素是：","o":[["A","事故与灾害"],["B","疾病"],["C","暴力犯罪"],["D","战争"]],"a":"ABC","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5038,"i":5035},{"q":"在校园中怎样做可以增加安全机率：","o":[["A","熟悉校园环境"],["B","不单独去上自习"],["C","低调行事"],["D","交一个高大的男朋友"]],"a":"ABC","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5039,"i":5036},{"q":"应对入室行窃时正确的做法：","o":[["A","如发现家门被撬，不要急于进去检查损失状况，应马上去邻居家报警。"],["B","如人在家时歹徒撬门破窗，可扭大电视音量、或高喊男士等以吓退歹徒。"],["C","持刀持棍先向歹徒发起攻击，趁其立足未稳将其打退。"],["D","如已面对刀枪，则交出钱物，但如歹徒进而灭口杀人，则应尽全力反抗。"]],"a":"ABCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5040,"i":5037},{"q":"张三与李四发生矛盾，张三用刀砍向李四，把李四胳膊砍伤。在行凶过程中李四捡起路边的砖头砸向张三，导致张三面部骨折，李四属于防卫过当。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5041,"i":5038},{"q":"咽喉下有食道、气管、静脉、膈神经与迷走神经分支，所以咽喉是人体的又一处要害部位。咽喉一旦遭遇打击，轻者说不出话，难受异常，重者窒息昏迷。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5042,"i":5039},{"q":"遇到犯罪分子应该给他讲理，尽量说服他放弃邪念。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5043,"i":5040},{"q":"腿法技术属于什么距离技术：","o":[["A","近距离。"],["B","中距离。"],["C","远距离。"]],"a":"C","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5044,"i":5041},{"q":"当你和对方搏斗倒地时首先要做的是：","o":[["A","把对方同时弄倒。"],["B","选择合理的倒地技术保证自身安全。"],["C","应该用手来支撑减缓冲击力。"]],"a":"B","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5045,"i":5042},{"q":"应对故意攻击伤人时正确的做法：","o":[["A","避免武斗，一走了之。"],["B","跑向有人的地方求助。"],["C","如没有生命危险，着手反击。"],["D","如对方不肯罢手，且自己又无退路，自卫者只好全力反击，以击退击伤歹徒。"]],"a":"ABCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5046,"i":5043},{"q":"以下哪些行为可以减少家庭遭受暴力犯罪的机率：","o":[["A","增加照明"],["B","安装监控系统"],["C","安装防盗门窗"],["D","养狗看门"]],"a":"ABCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5047,"i":5044},{"q":"防身自卫教育的两大主要目标是学会：","o":[["A","智力自卫"],["B","法律"],["C","武力自卫"],["D","锻炼身体"]],"a":"AC","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5048,"i":5045},{"q":"由于女子的力量素质与体能都远小于男子，故在遭遇暴力侵害的时候一定要将防卫策略与防卫术有机结合使用，如临场假装害怕、屈从来麻痹对方，使其放松警惕，再突发奇招，狠狠地攻击对方要害，使其在短时间内丧失侵害能力，为自己逃离和呼救争取时间，才能真正达到防卫自保的目的。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5049,"i":5046},{"q":"防卫过当，是指行为人在实施正当防卫时，明显超越正当防卫的法律限度，给不法侵害人造成重大损害的行为，不追究刑事责任。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5050,"i":5047},{"q":"一次成功的防卫与逃脱，是胆识、策略、机警、心理、能力等有机结合。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5051,"i":5048},{"q":"在遇到暴力犯罪时正确的做法是：","o":[["A","报警"],["B","求救"],["C","顺从"],["D","逃脱"]],"a":"ABD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5052,"i":5049},{"q":"双眼是人体中极易受到损伤的部位。攻击双眼无需太大的力量。一旦眼睛遭受打击，视觉功能产生严重障碍甚至丧失。妇女为免受进一步的侵害，戳击歹徒的眼睛，使其对外界的反应和攻击能力降低，或者完全丧失。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5053,"i":5050},{"q":"在日常生活中应该保持低调，不要炫耀自己的财富。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5054,"i":5051},{"q":"“月黑风高夜，杀人放火天”黑夜总是犯罪分子作案的好时段，为了人身财产安全，深夜外出要格外小心，尽可能行走偏僻小路。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5055,"i":5052},{"q":"你对待宿舍室友的态度应该是：","o":[["A","以嘲讽对方为乐。"],["B","讨厌对方，不理会。"],["C","尽量处好关系。"]],"a":"C","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5056,"i":5053},{"q":"你认为以下哪种情况最容易诱发暴力犯罪：","o":[["A","炫富。"],["B","性格张扬。"],["C","性格孤僻。"]],"a":"A","t":"单选","s":["防身自卫"],"src":"cgtk.org","qid":5057,"i":5054},{"q":"对付陌生人强暴时正确的做法：","o":[["A","如无生命危险，喊叫求援以吓退歹徒。"],["B","跑向有人的地方。"],["C","警告威胁对方,并着手反击。"],["D","如不服从便有生命危险时，只好妥协，让对方得逞而求保命。"]],"a":"ABCD","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5058,"i":5055},{"q":"尽可能避免与歹徒进行徒手搏斗，要养成利用随手可得的器物，如：钥匙、发针、伞、沙石、高跟鞋、可喷香水等作为武器，增强自身的防卫能力。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5059,"i":5056},{"q":"安全教育是一项大工程，在这项工程中加强人们的安全意识、训练提高他们的生存技能又是其中的重要环节。","o":[],"a":"正确","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5060,"i":5057},{"q":"如遇抢劫此类危情，除了要正确判断处，一要与对方保持一定的安全距离二至三米；二是要保持镇静；三必要时与对方硬拼，以保安全。","o":[],"a":"错误","t":"判断","s":["防身自卫"],"src":"cgtk.org","qid":5061,"i":5058},{"q":"女性在乘坐电梯时要注意：","o":[["A","不要单独与陌生人一起进电梯"],["B","见陌生人随后马上走出电梯"],["C","进了电梯要站在控制盘前"],["D","要携带必要的防身武器"]],"a":"ABC","t":"多选","s":["防身自卫"],"src":"cgtk.org","qid":5062,"i":5059},{"q":"人体的对称是（ ）对称","o":[["A","上下"],["B","前后"],["C","左右"],["D","以上都是"]],"a":"C","t":"单选","s":["健身瑜伽"],"src":"cgtk.org","qid":5063,"i":5060},{"q":"当迷路时，应立即停止前进，赶快回忆刚走过的路线，迅速沿原路返回；或者登上高处辨清方向后再行进。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5064,"i":5061},{"q":"地物是指分布在地面上的人工或自然的固定性物体,如湖泊、道路、建筑物。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5065,"i":5062},{"q":"地面上某两个点的海拔高度之差为高差。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5066,"i":5063},{"q":"在定向运动比赛中，因各种原因退出比赛者要被取消竞赛资格。","o":[],"a":"错误","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5067,"i":5064},{"q":"在定向运动比赛中，冒名顶替参加竞赛者要被取消竞赛资格。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5068,"i":5065},{"q":"利用明显地形点可以标定地图。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5069,"i":5066},{"q":"在没有指北针的情况下，利用天体可以判定方位。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5070,"i":5067},{"q":"定向地图的地图符号包括地物符号，洼地不属于地物符号。","o":[],"a":"错误","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5071,"i":5068},{"q":"定向运动的核心问题是识别和判定地图。","o":[],"a":"错误","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5072,"i":5069},{"q":"体质是指人体的质量，体质应包括体格、体能和适应能力三部分。","o":[],"a":"正确","t":"判断","s":["校园定向","游泳"],"src":"cgtk.org","qid":5073,"i":5070},{"q":"定向地图符号的大小，线条的粗细，符号间最小距离的规定，都是以日光条件下的正常视力为依据制定的。","o":[],"a":"错误","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5074,"i":5071},{"q":"终点的竞赛路线符号用一个圆圈表示。","o":[],"a":"错误","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5075,"i":5072},{"q":"实地斜坡的坡度为上陡下缓的斜面叫凹形斜面。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5076,"i":5073},{"q":"在一条典型的定向越野比赛路线中，起点用三角符号表示。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5077,"i":5074},{"q":"野外活动受伤时，应坚持“轻伤不下火线”的原则。","o":[],"a":"错误","t":"判断","s":[ ","是地图上最重要的参数之一"],["C","地图比例尺越大则显示实地信息越少"],["D","比例尺越大图上量测的精度越高"]],"a":"C","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5095,"i":5092},{"q":"哪种颜色表示开阔地___________。","o":[["A","白色"],["B","黄绿色"],["C","棕色"],["D","黄色"]],"a":"D","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5096,"i":5093},{"q":"以下哪种地貌不是特殊地貌。","o":[["A","冲沟"],["B","陡崖"],["C","山脚"],["D","滑坡"]],"a":"C","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5097,"i":5094},{"q":"最早的定向比赛出现在____________。","o":[["A","军营"],["B","学校"],["C","机关"],["D","社区"]],"a":"A","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5098,"i":5095},{"q":"在我国的北方地区，大部分山上的积雪情况是___________。","o":[["A","东南坡积雪较少，西北坡积雪较多"],["B","东南坡积雪较多，西北坡积雪较少"],["C","四面一样多"],["D","无法确定"]],"a":"B","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5099,"i":5096},{"q":"表示图上长度比实际缩小10000倍的比例尺通常写成_________。","o":[["A","1:10000"],["B","10000:1"],["C","10:100000"],["D","100000:10"]],"a":"A","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5100,"i":5097},{"q":"为预防定向越野损伤,下列措施除哪项外都是我们可采取的措施__________。","o":[["A","根据地形地貌和植被情况穿戴运动装备"],["B","训练和比赛时穿戴保护装置，如定向帽和护腿等"],["C","学会正确使用指北针和正确识别地图"],["D","充分做好下肢的准备活动，在复杂地貌上小心前进"]],"a":"C","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5101,"i":5098},{"q":"下列哪种方法不能用来实现通过两个点来确定未知的点_________。","o":[["A","交叉法"],["B","反向交叉法"],["C","延长线法"],["D","角度偏转法"]],"a":"D","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5102,"i":5099},{"q":"等高线特征之一是_________。","o":[["A","闭合曲线"],["B","不闭合"],["C","同一等高线上，高程不等"],["D","等高距愈小，坡度愈小"]],"a":"A","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5103,"i":5100},{"q":"以下关于定向比例尺的说法错误的是__________。","o":[["A","比例尺通常指的是地图上某一线段长度与相应实际水平距离之比"],["B","地图上表示比例尺的只有数字式和图解式"],["C","图上的直线比例尺属于图解比例尺"],["D","比例尺的主要作用是量算实际距离"]],"a":"B","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5104,"i":5101},{"q":"定向运动按运动形式可分为（_____ ）","o":[["A","徒步定向"],["B","山地车定向"],["C","滑雪定向"],["D","轮椅定向"]],"a":"ABCD","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5105,"i":5102},{"q":"路线选择时采用“遇障提前绕”的前提是（_____ ）","o":[["A","两点之间起伏较大"],["B","两点之间平坦"],["C","两点之间树林密集"],["D","两点之间障碍大"]],"a":"ACD","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5106,"i":5103},{"q":"对点标旗的正确描述是（_____ ）","o":[["A","它是三面标志旗连接成的三棱体"],["B","每面点标旗左上部为白色，右下部为橙红色"],["C","每面点标旗尺寸为30厘米*30厘米"],["D","每面点标旗为40厘米*40厘米"]],"a":"ABC","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5107,"i":5104},{"q":"等高线显示地貌的特点（_____ ）","o":[["A","在同一条等高线上各点的高度相等，并各自闭合。"],["B","在同一幅地图上，等高线多，山就高；等高线少，山就低；凹地相反"],["C","在同一幅地图上，等高线间隔密，实地坡度陡；等高线间隔稀，实地坡度缓"],["D","等高线的弯曲形状与相应实地地貌形态相似"]],"a":"ABCD","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5108,"i":5105},{"q":"在定向地图中，黄绿色表示的有（_____ ）","o":[["A","民宅"],["B","私家花园"],["C","私家草坪"],["D","森林"]],"a":"ABC","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5109,"i":5106},{"q":"比例尺的表现形式有（_____ ）","o":[["A","文字式"],["B","数字式"],["C","图解式"],["D","字母式"]],"a":"ABC","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5110,"i":5107},{"q":"在没有指北针的情况下可利用天体来判定方位如（_____ ）","o":[["A","利用太阳判定方位"],["B","夜间利用南十字星座判定方位"],["C","利用月亮判定方位"],["D","夜间利用北极星判定方位"]],"a":"ABD","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5111,"i":5108},{"q":"指北针是定向运动中参与者唯一可以使用的合法工具，其作用主要有（_____ ）","o":[["A","标定地图"],["B","辨别方向"],["C","途中遗失方向时用指北针走出困境"],["D","确定站立点与目标点的方向"]],"a":"ABCD","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5112,"i":5109},{"q":"磁北线是地图上表示地磁的方向线，它可以用来（_____ ）","o":[["A","标定地图的方向"],["B","测量目标的方位角"],["C","估算目标行进的方向和距离"],["D","使地图更加美观"]],"a":"ABC","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5113,"i":5110},{"q":"在制作定向地图时，测量图是适合作为定向地图制作的底图的。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5114,"i":5111},{"q":"确定站立点就是确定实地某一目标在地图上的相应位置。","o":[],"a":"错误","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5115,"i":5112},{"q":"对照地形就是将地图与相应实地的地物、地貌进行逐一对照。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5116,"i":5113},{"q":"在定向越野中，在起伏较大、树林密集、障碍大的地段，坚持“遇障提前绕”的原则。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5117,"i":5114},{"q":"尖山顶的等高线特点是环圈小而间隔小，转折锋锐。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5118,"i":5115},{"q":"凡是不能用等高线表示的地貌都称为特殊地貌，亦称变形地貌。","o":[],"a":"正确","t":"判断 _____。","o":[["A","高墙"],["B","树"],["C","湿地"],["D","道路"]],"a":"C","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5151,"i":5148},{"q":"当站立点附近无线状地物可以利用，地图与实地有两个明显的地形点，且地形较平坦、通透视线较好的地段可以采用_________确定站立点。","o":[["A","截线法"],["B","连线法"],["C","后方交汇法"],["D","分析法"]],"a":"C","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5152,"i":5149},{"q":"下列不属于线状地物的是_________。","o":[["A","道路"],["B","高压线"],["C","高塔"],["D","水渠"]],"a":"C","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5153,"i":5150},{"q":"1961年5月，国际定向运动联合会（IOF）在_________成立。","o":[["A","巴黎"],["B","哥本哈根"],["C","柏林"],["D","斯德哥尔摩"]],"a":"B","t":"单选","s":["校园定向"],"src":"cgtk.org","qid":5154,"i":5151},{"q":"路线选择中使用水平位移法时，应注意以下几点（_____ ）","o":[["A","站立点或辅助点与检查点在同一高度"],["B","站立点或辅助点与检查点之间植被可通行且无其他不利奔跑的障碍物"],["C","有意识地将目标偏移一定角度"],["D","由于体力下降的原因，往往令你无意识的往山下偏移，努力做到下（上）几米就上（下）几米的纠错措施"]],"a":"ABD","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5155,"i":5152},{"q":"在定向地图中，蓝色表示的有（_____ ）","o":[["A","沼泽地"],["B","河流"],["C","水坑"],["D","喷泉"]],"a":"ABCD","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5156,"i":5153},{"q":"等高线的种类有（_____ ）","o":[["A","首曲线"],["B","间曲线"],["C","助曲线"],["D","计曲线"]],"a":"ABCD","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5157,"i":5154},{"q":"在定向运动规则中，下列情况判运动员成绩无效（_____ ）","o":[["A","受到裁判员二次警告者"],["B","竞赛中超过组委会规定的终点关门时间"],["C","在比赛中丢失指卡、地图、号码布"],["D","因各种原因退出比赛者"]],"a":"ABCD","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5158,"i":5155},{"q":"路线选择的方法有（_____ ）","o":[["A","借线法"],["B","借点法"],["C","偏向瞄准法"],["D","水平位移法"]],"a":"ABCD","t":"多选","s":["校园定向"],"src":"cgtk.org","qid":5159,"i":5156},{"q":"在定向运动中，为了给地图定向和辨别方向，最有用的工具就是指北针。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5160,"i":5157},{"q":"1931年举行了第一届世界定向锦标赛。","o":[],"a":"错误","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5161,"i":5158},{"q":"当检查点设在明显，较大的地物、地貌点上或附近时，可采用定点攻击法。","o":[],"a":"正确","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5162,"i":5159},{"q":"在定向运动比赛中，出发后未到终点报到判运动员成绩无效。","o":[],"a":"错误","t":"判断","s":["校园定向"],"src":"cgtk.org","qid":5163,"i":5160},{"q":"地图 const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const subjOf = it => Array.isArray(it.s) ? it.s.map(x=>String(x).trim()).filter(Boolean)
                              : String(it.s||'').split('/').map(x=>x.trim()).filter(Boolean);

function hl(text, words){
  let t = esc(text);
  for (const w of words){
    if (!w) continue;
    const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    t = t.replace(re, m => '\u0000'+m+'\u0001');
  }
  return t.replace(/\u0000/g,'<mark>').replace(/\u0001/g,'</mark>');
}

function render(){
  const kwRaw = $('#q').value.trim();
  const words = kwRaw ? kwRaw.split(/\s+/).filter(Boolean) : [];
  const subject = $('#s').value;
  const type = $('#t').value;

  let out = [];
  for (const it of DATA){
    if (type && it.t !== type) continue;
    if (subject && !subjOf(it).includes(subject)) continue;
    if (words.length){
      const hay = it.q + ' ' + it.a + ' ' + (it.o||[]).map(o=>o[1]).join(' ');
      let ok = true;
      for (const w of words){ if (hay.toLowerCase().indexOf(w.toLowerCase()) < 0){ ok = false; break; } }
      if (!ok) continue;
    }
    out.push(it);
    if (out.length >= 300) break;
  }

  const list = $('#list');
  if (!out.length){ list.innerHTML = '<div class="empty">没有匹配的题目 · 换个关键词试试</div>'; }
  else {
    list.innerHTML = out.map(it => {
      const opts = (it.o||[]).length
        ? '<ul class="opts">' + it.o.map(o=>'<li><b>'+esc(o[0])+'</b>'+hl(o[1],words)+'</li>').join('') + '</ul>'
        : '';
      const tags = ['#'+it.i, it.t].concat(subjOf(it)).filter(Boolean)
        .map(x=>'<span class="tag">'+esc(x)+'</span>').join('');
      return '<div class="card"><div class="no">'+it.i+'</div><div class="body">'
        + '<div class="stem">'+hl(it.q,words)+'</div>' + opts
        + '<div class="ans">答案：<b>'+hl(it.a,words)+'</b></div>'
        + '<div class="tags">'+tags+'</div></div></div>';
    }).join('');
  }

  const total = out.length >= 300 ? '300+' : out.length;
  $('#stat').textContent = '命中 ' + total + ' 条 / 共 ' + DATA.length + ' 题'
    + (words.length ? ' · 关键词：' + words.join(' ') : '');
}

let timer = null;
function schedule(){ clearTimeout(timer); timer = setTimeout(render, 90); }
$('#q').addEventListener('input', schedule);
$('#s').addEventListener('change', render);
$('#t').addEventListener('change', render);
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape'){ $('#q').value=''; render(); } });
render();
</script></body></html>
